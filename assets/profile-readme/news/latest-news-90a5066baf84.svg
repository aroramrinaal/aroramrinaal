<svg xmlns="http://www.w3.org/2000/svg" width="70" height="36" viewBox="0 -3 70 36">
  <style>
    .feed { animation: feed 1100ms 200ms both; }
    @keyframes feed {
      0% { transform: translateX(64px); animation-timing-function: steps(11, end); }
      82% { transform: translateX(3px); animation-timing-function: cubic-bezier(0.2, 0.8, 0.3, 1); }
      100% { transform: translateX(0); }
    }
    .punch { transform-box: fill-box; transform-origin: center; animation: punch 380ms 1380ms both; }
    @keyframes punch {
      0% { transform: scale(0); animation-timing-function: cubic-bezier(0.3, 1.6, 0.5, 1); }
      100% { transform: scale(1); }
    }
    .hang, .knock { transform-origin: 11px 15.15px; }
    .hang { animation: hang 1500ms 1760ms both; }
    @keyframes hang {
      0% { transform: rotate(0); animation-timing-function: cubic-bezier(0.4, 0, 0.7, 0.4); }
      30% { transform: rotate(3deg); animation-timing-function: cubic-bezier(0.3, 0.6, 0.5, 1); }
      52% { transform: rotate(-1.2deg); animation-timing-function: ease-in-out; }
      70% { transform: rotate(0.6deg); animation-timing-function: ease-in-out; }
      86% { transform: rotate(-0.2deg); animation-timing-function: ease-in-out; }
      100% { transform: rotate(0); }
    }
    .knock { animation: knock 8000ms linear infinite; }
    @keyframes knock {
      0%, 92.25% { transform: rotate(0); animation-timing-function: cubic-bezier(0.2, 0.7, 0.3, 1); }
      93.63% { transform: rotate(2.2deg); animation-timing-function: ease-in-out; }
      95.44% { transform: rotate(-0.9900000000000001deg); animation-timing-function: ease-in-out; }
      97.25% { transform: rotate(0.45deg); animation-timing-function: ease-in-out; }
      98.88% { transform: rotate(-0.15deg); animation-timing-function: ease-in-out; }
      100% { transform: rotate(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .feed, .punch, .hang, .knock { animation: none !important; }
    }
  </style>
  <defs>
    <mask id="lt-hole" maskUnits="userSpaceOnUse" x="-80" y="-20" width="240" height="70">
      <rect x="-80" y="-20" width="240" height="70" fill="#fff"/>
      <circle class="punch" cx="11" cy="15" r="2.5" fill="#000"/>
    </mask>
  </defs>
  <g class="feed"><g class="hang"><g class="knock"><g mask="url(#lt-hole)">
    <path d="M12 0.775 H65.5 Q69 0.775 69 4.275 V26 Q69 29.5 65.5 29.5 H12 L1.5 15.1375 Z" fill="#B45309"/>
    <path d="M12 0.775 H65.5 Q69 0.775 69 4.275 V26 Q69 29.5 65.5 29.5 H12 L1.5 15.1375 Z" fill="none" stroke="#7C2D12" stroke-width="0.75" stroke-linejoin="round"/>
    <text x="41.25" y="20.6" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0.2" fill="#FFFFFF">latest</text>
  </g></g></g></g>
</svg>
