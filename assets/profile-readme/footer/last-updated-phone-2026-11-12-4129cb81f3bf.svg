<svg xmlns="http://www.w3.org/2000/svg" width="188" height="92" viewBox="0 0 188 92"><style>
    .tool { animation: tool 3600ms infinite; } .press { animation: press 3600ms infinite; } .fresh { animation: fresh 3600ms infinite; } .wet { animation: wet 3600ms infinite; } .ink { animation: ink 3600ms infinite; } .shadow { animation: shadow 3600ms infinite; } .dent { animation: dent 3600ms infinite; } .paper { animation: paper 3600ms infinite; }
    .press { transform-box: fill-box; transform-origin: center bottom; }
    .fresh, .wet { transform-box: fill-box; transform-origin: center; }
    @keyframes tool {
      0% { transform: translate(94px, -6px); animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      19.444% { transform: translate(94px, -6px); animation-timing-function: cubic-bezier(0, 0, 0.6, 1); }
      31.944% { transform: translate(94px, 62px); animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      34.722% { transform: translate(94px, 54px); animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45); }
      36.944% { transform: translate(94px, 84px); animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      40.833% { transform: translate(94px, 84px); animation-timing-function: cubic-bezier(0, 0.55, 0.45, 1); }
      44.444% { transform: translate(94px, 66px); animation-timing-function: cubic-bezier(0.4, 0, 1, 1); }
      52.778% { transform: translate(94px, -6px); animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      100% { transform: translate(94px, -6px); animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
    }
    @keyframes press {
      0% { transform: rotate(0deg) scaleY(1); animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      36.944% { transform: rotate(0deg) scaleY(1); animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      38.056% { transform: rotate(0deg) scaleY(0.86); animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      40.278% { transform: rotate(0deg) scaleY(0.95); animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      42.5% { transform: rotate(0deg) scaleY(1.03); animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      44.722% { transform: rotate(0deg) scaleY(1); animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      100% { transform: rotate(0deg) scaleY(1); animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
    }
    @keyframes ink {
      0% { opacity: 1; animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      36.944% { opacity: 1; animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      38.056% { opacity: 0.35; animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      100% { opacity: 0.35; animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
    }
    @keyframes fresh {
      0% { opacity: 1; transform: scale(1); animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      11.111% { opacity: 1; transform: scale(1); animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      18.056% { opacity: 0; transform: scale(1.05); animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      36.944% { opacity: 0; transform: scale(1.05); animation-timing-function: steps(1, end); }
      36.972% { opacity: 1; transform: scale(1.05); animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      44.722% { opacity: 1; transform: scale(1); animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      100% { opacity: 1; transform: scale(1); animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
    }
    @keyframes wet {
      0% { opacity: 0; animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      36.944% { opacity: 0; animation-timing-function: steps(1, end); }
      36.972% { opacity: 1; animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      46.389% { opacity: 0.8; animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      68.611% { opacity: 0; animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      100% { opacity: 0; animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
    }
    @media (prefers-reduced-motion: reduce) { .tool, .press, .fresh, .wet, .ink, .shadow, .dent, .paper { animation: none !important; } }
  </style>

